apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts
spec:
  replicas: 1
  selector:
    matchLabels: {app: accounts}
  template:
    metadata:
      labels: {app: accounts}
    spec:
      containers:
        - name: accounts
          image: devops-accounts:1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URI
              valueFrom:
                secretKeyRef: {name: accounts-db, key: uri}
            - name: FORCE_HTTPS
              value: 'false'
            - name: CORS_ORIGINS
              value: 'http://localhost:8080'
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 15
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: accounts
spec:
  selector: {app: accounts}
  ports:
    - port: 8080
      targetPort: 8080
